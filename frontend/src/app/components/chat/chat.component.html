<div class="chat">
  <!-- Header -->
  <header class="chat__header">
    <div class="chat__avatar">HR</div>
    <div class="chat__titles">
      <h1 class="chat__title">HR Policy Assistant</h1>
      <span class="chat__subtitle">Ask about leave, benefits, working hours &amp; more</span>
    </div>
    <span class="chat__badge" [class.chat__badge--busy]="isThinking">
      {{ isThinking ? 'Thinking…' : 'Online' }}
    </span>
  </header>

  <!-- Message list -->
  <div class="chat__messages">
    <div
      *ngFor="let msg of messages"
      class="msg"
      [class.msg--user]="msg.role === 'user'"
      [class.msg--assistant]="msg.role === 'assistant'"
    >
      <div class="msg__bubble">
        <p class="msg__text">{{ msg.text }}</p>

        <!-- Source citations from the RAG pipeline -->
        <div class="msg__sources" *ngIf="msg.sources?.length">
          <span class="msg__sources-label">Sources</span>
          <a
            *ngFor="let src of msg.sources"
            class="msg__source"
            [attr.href]="src.url || null"
            [attr.target]="src.url ? '_blank' : null"
            [attr.rel]="src.url ? 'noopener' : null"
          >
            📄 {{ src.title }}<span *ngIf="src.section"> · {{ src.section }}</span>
          </a>
        </div>
      </div>
      <span class="msg__time">{{ msg.timestamp | date: 'shortTime' }}</span>
    </div>

    <!-- Typing indicator -->
    <div class="msg msg--assistant" *ngIf="isThinking">
      <div class="msg__bubble msg__bubble--typing">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>
    </div>

    <div #scrollAnchor></div>
  </div>

  <!-- Suggestions (only before the user has asked anything) -->
  <div class="chat__suggestions" *ngIf="messages.length <= 1 && !isThinking">
    <button
      type="button"
      class="chip"
      *ngFor="let s of suggestions"
      (click)="useSuggestion(s)"
    >
      {{ s }}
    </button>
  </div>

  <!-- Input -->
  <form class="chat__input" (ngSubmit)="send()">
    <input
      type="text"
      name="draft"
      class="chat__field"
      placeholder="Type your HR question…"
      autocomplete="off"
      [(ngModel)]="draft"
      [disabled]="isThinking"
    />
    <button
      type="submit"
      class="chat__send"
      [disabled]="!draft.trim() || isThinking"
      aria-label="Send message"
    >
      ➤
    </button>
  </form>
</div>
